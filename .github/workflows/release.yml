name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Lets azure/login trade the job's OIDC token for an Azure token.
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    # Holds the Azure and signing variables. The Entra app trusts only this environment.
    environment: release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test ScanBridge.sln -c Release

      # Folder publish, no trimming/single-file: keeps the LGPL NAPS2 assemblies
      # separate and user-replaceable (see THIRD-PARTY-NOTICES.md).
      - name: Publish
        run: >
          dotnet publish src/ScanBridge -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Sign only our own binaries, before the zip and the installer pick them up.
      # The .NET runtime and the NAPS2 and other third-party files keep their
      # publishers' signatures (and stay unmodified, per THIRD-PARTY-NOTICES.md).
      - name: Sign app binaries
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: gcgov-certificate-profile-public
          # |- drops the trailing newline, which the action would turn into an empty entry.
          files: |-
            ${{ github.workspace }}\publish\ScanBridge.exe
            ${{ github.workspace }}\publish\ScanBridge.dll

      - name: Zip portable build
        shell: pwsh
        run: |
          Copy-Item README.md, THIRD-PARTY-NOTICES.md, LICENSE publish/
          Compress-Archive -Path publish/* -DestinationPath "ScanBridge-${{ steps.version.outputs.version }}-win-x64-portable.zip"

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ScanBridge.iss `
            /DAppVersion=${{ steps.version.outputs.version }} `
            /DPublishDir=..\publish
          Move-Item installer\Output\ScanBridge-${{ steps.version.outputs.version }}-setup.exe .

      - name: Sign installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: gcgov-certificate-profile-public
          files: ${{ github.workspace }}\ScanBridge-${{ steps.version.outputs.version }}-setup.exe

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ScanBridge-${{ steps.version.outputs.version }}-win-x64-portable.zip
            ScanBridge-${{ steps.version.outputs.version }}-setup.exe
          generate_release_notes: true

  # Opens a pull request on microsoft/winget-pkgs for the signed installer.
  # A separate job, so a winget problem never fails the release, and a re-run retries only this part.
  winget:
    needs: release
    # Tags with a hyphen, such as v1.2.0-beta.1, are pre-releases and stay off winget.
    if: ${{ !contains(needs.release.outputs.version, '-') }}
    runs-on: windows-latest
    # Holds the WINGET_TOKEN secret, out of reach of workflows on branches.
    environment: release
    permissions: {}
    env:
      PACKAGE_ID: GarrettCountyGovernment.ScanBridge
      VERSION: ${{ needs.release.outputs.version }}
      # wingetcreate reads its GitHub token from this variable.
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit to winget
        shell: pwsh
        run: |
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) {
            "::error::Add the WINGET_TOKEN secret to the release environment (see README.md)."
            exit 1
          }

          # wingetcreate updates a package from its previous version in winget-pkgs.
          # The first version goes in by hand (see README.md), so skip until it is there.
          $path = 'manifests/{0}/{1}' -f $env:PACKAGE_ID.Substring(0, 1).ToLower(), $env:PACKAGE_ID.Replace('.', '/')
          $existing = Invoke-WebRequest "https://api.github.com/repos/microsoft/winget-pkgs/contents/$path" `
            -Headers @{ Authorization = "Bearer $env:WINGET_CREATE_GITHUB_TOKEN" } -SkipHttpErrorCheck
          if ($existing.StatusCode -eq 404) {
            "::warning::$env:PACKAGE_ID is not in winget-pkgs yet. Submit the first version by hand (see README.md), then re-run this job."
            exit 0
          }
          if ($existing.StatusCode -ne 200) {
            throw "The GitHub API returned $($existing.StatusCode) for microsoft/winget-pkgs/$path."
          }

          curl.exe -fsSL -o wingetcreate.exe https://aka.ms/wingetcreate/latest
          $release = "https://github.com/$env:GITHUB_REPOSITORY/releases"
          # The Inno Setup bootstrapper is a 32-bit exe, so wingetcreate reads it as x86.
          # "|x64" states the architecture of the app that it installs.
          .\wingetcreate.exe update $env:PACKAGE_ID `
            --version $env:VERSION `
            --urls "$release/download/$env:GITHUB_REF_NAME/ScanBridge-$env:VERSION-setup.exe|x64" `
            --release-notes-url "$release/tag/$env:GITHUB_REF_NAME" `
            --submit --no-open
