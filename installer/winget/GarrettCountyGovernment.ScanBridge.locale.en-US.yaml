ShortDescription: Lets web applications scan documents from desktop scanners through a local HTTP API.
Description: |-
  ScanBridge is a Windows tray app that scans documents for web applications.
  A web page calls the local HTTP API on 127.0.0.1.
  ScanBridge scans from a WIA, TWAIN, or ESCL scanner through the NAPS2 SDK.
  It returns the result to the page as a PDF file.
  An administrator lists the website origins that can scan.
